<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint-05 - Refatoração com Tailwind CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/output.css">
</head>

<body>

    <section
        class="min-h-dvh bg-[url(/images/banner0.jpg)] bg-no-repeat bg-cover bg-center p-(--spacing-md) flex flex-col justify-center items-start gap-(--spacing-md)">
        <h1 class="font-(family-name:--font-body) text-(length:--font-lg) text-(--color-light) w-1/2 text-balance">
            Encontre o tênis que combina com
            você.</h1>
        <a href=""
            class="no-underline text-(--color-dark) bg-(--color-light) py-(--spacing-sm) px-(--spacing-lg) rounded-md text-(length:--font-sm) font-semibold">Comprar
            agora</a>
    </section>

    <section
        class="w-largura my-(--spacing-xl) mx-auto text-center grid grid-cols-3 gap-y-(--spacing-md) gap-x-(--spacing-lg)">
        <div class="relative">
            <img class="rounded-md" src="./images/tenis01.jpg" alt="compre seu tênis">
            <a href=""
                class="no-underline text-(--color-dark) bg-(--color-light) py-(--spacing-sm) px-(--spacing-lg) rounded-md text-(length:--font-sm) font-semibold absolute bottom-(--spacing-md) left-(--spacing-md)">Comprar

            <a href=""

                agora</a>
        </div>
    </section>

    <section class="logos overflow-hidden flex group">
        <div class="logos-slide flex items-center justify-center shrink-0 animate-slide group-hover:paused">
